name: Video pipeline

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clay-reference-authoring:
    name: clay-reference-authoring
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install clay authoring dependencies
        run: python -m pip install numpy==1.26.4 Pillow==11.3.0 opencv-python-headless==4.10.0.84
      - name: Check source-timed clay assets, text and localization
        run: python -m unittest discover -s video-pipeline/test -p 'test_reference_clay.py'
  qc:
    name: video-pipeline-qc
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: video-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: video-pipeline/package-lock.json
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-cjk fonts-noto-color-emoji
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run render -- ep02 --scene-gate
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VIDEO_PIPELINE_HUMAN_REVIEWERS: ${{ vars.VIDEO_PIPELINE_HUMAN_REVIEWERS }}
      - name: Keep QC logs and review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-pipeline-qc
          path: |
            video-pipeline/out/**/job.json
            video-pipeline/out/**/encoder.log
            video-pipeline/out/**/*.png
          if-no-files-found: ignore
          retention-days: 7
