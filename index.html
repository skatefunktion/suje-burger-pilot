<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국 수제버거가 만들어지는 과정 — 파일럿 v3</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#26221c;color:#f5efe2;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
  h1{font-size:18px;margin:8px 0 12px;font-weight:700}
  h1 span{font-weight:400;font-size:13px;color:#b9ac93}
  #wrap{width:100%;max-width:960px}
  canvas{width:100%;display:block;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.45);cursor:pointer;background:#FAF5EA}
  #bar{height:6px;background:#4a4238;border-radius:3px;margin-top:10px;overflow:hidden}
  #fill{height:100%;width:0%;background:#E8A94F}
  #cap{min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;line-height:1.5;padding:10px 12px}
  #btns{display:flex;gap:10px;margin:6px 0 18px;flex-wrap:wrap;justify-content:center}
  button{background:#E8A94F;border:none;color:#26221c;font-weight:700;font-size:15px;padding:10px 18px;border-radius:999px;cursor:pointer}
  button:active{transform:scale(.96)}
  #hint{font-size:13px;color:#b9ac93;text-align:center;max-width:660px;line-height:1.7}
</style>
</head>
<body>
<h1>🍔 한국 수제버거가 만들어지는 과정 <span>— 파일럿 v3 (탭하면 다음 장면)</span></h1>
<div id="wrap">
  <canvas id="stage" width="960" height="540"></canvas>
  <div id="bar"><div id="fill"></div></div>
  <div id="cap"></div>
  <div id="btns">
    <button id="bReplay">⏯ 다시 보기</button>
    <button id="bNext">⏭ 다음 장면</button>
    <button id="bRec">● 녹화</button>
  </div>
  <p id="hint">화면을 탭하면 다음 장면으로 넘어갑니다. '녹화'를 누르면 처음부터 재생되며 webm 영상으로 저장됩니다.<br>내레이션 음성은 Fish Audio TTS 등으로 장면별 제작해 합치는 구조입니다. (스토리보드는 storyboard.md)</p>
</div>
<script>
"use strict";
/* ================= 기본 설정 ================= */
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
/* BEGIN GENERATED PILOT SOURCES */
function createCanvasKit(ctx){
const W=960,H=540;
const INK='#4a3728',PAPER='#FAF5EA';
const BUN='#F3B75E',BUN_D='#D98F3C',PATTY='#8A5632',PATTY_D='#5F3A1E',
      CHEESE='#F7C948',CHEESE_D='#D9962B',LETTUCE='#8CC084',LETTUCE_D='#5E9B55',
      TOMATO='#E85D4D',TOMATO_D='#C23E30',TOMATO_L='#F4937F',
      SAUCE='#A8542F',SAUCE_L='#C97B4E',GREEN='#6FA85F',GRAY='#8a7a63';
const STROKE=Object.freeze({ fine: 2, ink: 3, emphasis: 4 });
const TYPE=Object.freeze({ note: 18, caption: 22, label: 34, title: 44 });
ctx.lineJoin='round';ctx.lineCap='round';

/* ================= 유틸 ================= */
const clamp01=v=>Math.max(0,Math.min(1,v));
const seg=(t,a,b)=>clamp01((t-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeO=t=>1-Math.pow(1-t,3);
const easeOB=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

function jline(x1,y1,x2,y2,seed=1,amp=2.2){
  const n=9;ctx.beginPath();
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,px=-dy/len,py=dx/len;
  for(let i=0;i<=n;i++){const t=i/n;
    const off=(rnd(seed*13+i*7)-.5)*2*amp*Math.sin(t*Math.PI);
    const X=x1+dx*t+px*off,Y=y1+dy*t+py*off;
    i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
  ctx.stroke();
}
function jellipse(x,y,rx,ry,seed=5,a0=0,a1=Math.PI*2){
  const n=28;ctx.beginPath();
  for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;
    const rj=1+(rnd(seed*17+i*3)-.5)*0.06;
    const X=x+Math.cos(a)*rx*rj,Y=y+Math.sin(a)*ry*rj;
    i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
  ctx.closePath();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

const paperDots=[];for(let i=0;i<90;i++)paperDots.push([rnd(i)*W,rnd(i+999)*H,rnd(i+50)*2+0.5]);
function bg(){
  ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(74,55,40,0.05)';
  for(const d of paperDots){ctx.beginPath();ctx.arc(d[0],d[1],d[2],0,7);ctx.fill();}
  // 은은한 비네팅
  const g=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(74,55,40,0.08)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function label(txt,x,y,size=TYPE.label,color=INK,weight=800){
  ctx.fillStyle=color;
  ctx.font=weight+' '+size+'px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y);
}

/* ============ v2 헬퍼: 그림자·광택·얼굴·뱃지 ============ */
function softShadow(x,y,w){
  ctx.fillStyle='rgba(74,55,40,0.13)';
  ctx.beginPath();ctx.ellipse(x,y,Math.max(10,w/2),Math.max(6,w*0.045),0,0,7);ctx.fill();
}
function sheen(x,y,rx,ry){
  ctx.save();ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.beginPath();ctx.ellipse(x,y,rx,ry,-0.5,0,7);ctx.fill();ctx.restore();
}
function face(x,y,s){
  s=s||1;
  ctx.fillStyle=INK;
  ctx.beginPath();ctx.ellipse(x-13*s,y,5*s,7*s,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+13*s,y,5*s,7*s,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(233,120,105,0.5)';
  ctx.beginPath();ctx.ellipse(x-26*s,y+9*s,6.5*s,4.2*s,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(x+26*s,y+9*s,6.5*s,4.2*s,0,0,7);ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=STROKE.ink*s;ctx.beginPath();
  ctx.arc(x,y+5*s,10*s,Math.PI*0.2,Math.PI*0.8);ctx.stroke();
}
function pill(txt,x,y,bgc,fgc,size){
  bgc=bgc||GREEN;fgc=fgc||'#fff';size=size||TYPE.caption;
  ctx.font='700 '+size+'px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
  const tw=ctx.measureText(txt).width,pad=size*0.75;
  ctx.fillStyle=bgc;ctx.strokeStyle=INK;ctx.lineWidth=STROKE.ink;
  rr(x-tw/2-pad/2,y-size*0.78,tw+pad,size*1.56,size*0.78);ctx.fill();ctx.stroke();
  ctx.fillStyle=fgc;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(txt,x,y+1);
}
function numBadge(n,x,y,a){
  ctx.save();ctx.globalAlpha=a===undefined?1:a;
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(x,y,17,0,7);ctx.fill();
  ctx.fillStyle=PAPER;ctx.font='800 22px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(n),x,y+1);
  ctx.restore();
}
return {W,H,INK,PAPER,BUN,BUN_D,PATTY,PATTY_D,CHEESE,CHEESE_D,LETTUCE,LETTUCE_D,TOMATO,TOMATO_D,TOMATO_L,SAUCE,SAUCE_L,GREEN,GRAY,STROKE,TYPE,clamp01,seg,lerp,rnd,easeIO,easeO,easeOB,jline,jellipse,rr,bg,label,softShadow,sheen,face,pill,numBadge};
}

function createBurgerScenes(ctx, kit) {
  const { seg, lerp, easeIO, easeO, rr, numBadge } = kit;
  const C = {
    panel: '#FFFDF7', cream: '#F4EADD', line: '#E5D8C7', ink: '#2E2921', muted: '#685C4E',
    green: '#315947', leaf: '#74A766', mint: '#DEEBDD', dark: '#254638',
    bun: '#E4A457', toast: '#BE753B', butter: '#F4C853', wheat: '#F6E7C6',
    tomato: '#CB5944', rose: '#F4DCD2', meat: '#754433', sauce: '#87462F', glaze: '#A94E2A',
    sky: '#DDEAE9', blue: '#53797C', white: '#FFFFFF',
  };

  function box(x, y, w, h, r, color) {
    ctx.fillStyle = color;
    rr(x, y, w, h, r);
    ctx.fill();
  }

  function oval(x, y, rx, ry, color, angle = 0) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, angle, 0, Math.PI * 2);
    ctx.fill();
  }

  function polygon(points, color) {
    ctx.beginPath();
    for (const [i, [x, y]] of points.entries()) i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function line(points, color = C.line, width = 2) {
    ctx.beginPath();
    for (const [i, [x, y]] of points.entries()) i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    ctx.lineJoin = ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  function text(value, x, y, size, color = C.ink, weight = 700, align = 'left', limit) {
    ctx.font = weight + ' ' + size + 'px "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    if (limit === undefined) ctx.fillText(value, x, y);
    else ctx.fillText(value, x, y, limit);
  }

  function center(value, x, y, size, color = C.ink, weight = 700) {
    text(value, x, y, size, color, weight, 'center');
  }

  function arrow(x, y, width, color = C.green) {
    line([[x, y], [x + width, y]], color);
    line([[x + width - 6, y - 5], [x + width, y], [x + width - 6, y + 5]], color);
  }

  function tag(value, x, y, width, fill = C.mint, color = C.dark) {
    box(x, y, width, 30, 15, fill);
    center(value, x + width / 2, y + 15, 15, color);
  }

  function stage() {
    box(18, 18, 924, 444, 26, C.panel);
  }

  function heading(step, title, detail) {
    stage();
    tag(step, 48, 42, 48);
    text(title, 112, 57, 32);
    if (detail) text(detail, 906, 60, 15, C.muted, 500, 'right');
    line([[48, 88], [912, 88]]);
  }

  function accent(x, y, color) {
    line([[x - 8, y], [x + 8, y]], color, 2.5);
    line([[x, y - 8], [x, y + 8]], color, 2.5);
  }

  function seeds(x, y, scale, color = C.panel) {
    for (const [dx, dy, angle] of [[-25, 0, -.4], [-10, -7, .5], [4, 3, -.7], [15, -6, .2], [28, 1, .55]]) {
      oval(x + dx * scale, y + dy * scale, 3.9 * scale, 1.65 * scale, color, angle);
    }
  }

  function dome(x, y, width, height, color) {
    ctx.beginPath();
    ctx.moveTo(x - width / 2, y);
    ctx.bezierCurveTo(x - width * .46, y - height * 1.28, x + width * .46, y - height * 1.28, x + width / 2, y);
    ctx.quadraticCurveTo(x + width * .49, y + 8, x + width * .41, y + 8);
    ctx.lineTo(x - width * .41, y + 8);
    ctx.quadraticCurveTo(x - width * .49, y + 8, x - width / 2, y);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function lettuce(x, y, width, height) {
    ctx.beginPath();
    ctx.moveTo(x - width / 2, y + height / 2);
    ctx.quadraticCurveTo(x - width / 2, y, x - width * .43, y);
    ctx.lineTo(x + width * .43, y);
    ctx.quadraticCurveTo(x + width / 2, y, x + width / 2, y + height / 2);
    for (let i = 0; i < 6; i++) {
      const x1 = x + width / 2 - width * i / 6;
      ctx.quadraticCurveTo(x1 - width / 12, y + height * 1.35, x1 - width / 6, y + height / 2);
    }
    ctx.fillStyle = C.leaf;
    ctx.fill();
  }

  const offsets = [0, -16, -24, -35, -50, -69];
  const ingredients = ['아래 번', '양상추', '토마토', '치즈', '패티', '위 번'];
  const layerColors = [C.bun, C.leaf, C.tomato, C.butter, C.meat, C.bun];

  function layer(index, x, y, scale, topped = true) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    const color = layerColors[index];
    switch (index) {
      case 0:
        box(-100, -9, 200, 24, 12, C.toast);
        box(-100, -10, 200, 17, 8, color);
        break;
      case 1:
        lettuce(0, 0, 212, 13);
        break;
      case 2:
        box(-100, -5, 98, 15, 7, color);
        box(1, -5, 99, 15, 7, color);
        break;
      case 3:
        polygon([[-101, -4], [101, -4], [88, 7], [26, 7], [8, 17], [-11, 7], [-92, 7]], color);
        break;
      case 4:
        box(-98, -12, 196, 23, 11, color);
        line([[-78, 2], [69, 2]], '#92573C', 2);
        break;
      case 5:
        dome(0, 0, 210, 53, color);
        if (topped) seeds(0, -24, 1.65);
        break;
    }
    ctx.restore();
  }

  function burger(x, y, scale) {
    for (const [i, offset] of offsets.entries()) layer(i, x, y + offset * scale, scale);
  }

  function plate(x, y, width, fill = C.sky) {
    oval(x, y, width / 2, width * .078, fill);
    oval(x, y, width * .38, width * .042, C.panel);
  }

  function icon(kind, x, y, s = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    switch (kind) {
      case 'flour':
        box(-20, -15, 40, 42, 8, C.wheat);
        box(-17, -21, 34, 8, 3, C.toast);
        line([[-6, 15], [7, -4]], C.toast);
        oval(-5, 5, 4, 7, C.toast, -.6);
        oval(6, 7, 7, 3, C.toast, -.55);
        break;
      case 'beef':
        box(-27, -20, 54, 40, 17, C.tomato);
        oval(13, -1, 8, 10, C.rose, -.55);
        oval(13, -1, 4, 5, C.sauce, -.55);
        line([[-19, -3], [-12, -8], [-5, -4]], C.rose, 2.5);
        break;
      case 'veg':
        oval(-10, 0, 15, 23, C.leaf, -.55);
        line([[-20, -12], [-5, 14]], C.green);
        oval(13, 6, 15, 13, C.tomato);
        line([[9, -5], [13, -8], [18, -4]], C.green);
        break;
      case 'cheese':
        polygon([[-24, -7], [10, -22], [26, -7], [26, 16], [-24, 16]], C.butter);
        polygon([[-24, -7], [26, -7], [26, 16], [-24, 16]], C.bun);
        oval(-9, 4, 4, 4, C.toast);
        oval(8, 10, 3, 3, C.toast);
        oval(17, -1, 4, 3, C.toast);
        break;
      case 'sesame':
        seeds(0, 0, .72, C.toast);
        seeds(1, 12, .55, '#9E643B');
        break;
      case 'sauce':
        box(-14, -10, 28, 34, 7, C.sauce);
        box(-8, -19, 16, 12, 3, C.toast);
        box(-9, 0, 18, 13, 3, C.wheat);
        break;
      case 'farm':
        oval(0, 15, 37, 10, C.mint);
        box(-22, -16, 44, 35, 4, C.tomato);
        polygon([[-27, -13], [0, -34], [27, -13]], C.sauce);
        box(-8, 0, 16, 19, 3, C.wheat);
        break;
      case 'shop':
        box(-24, -15, 48, 34, 4, C.wheat);
        box(-16, 2, 14, 13, 2, C.sky);
        box(5, 0, 11, 19, 2, C.green);
        box(-28, -24, 56, 13, 5, C.tomato);
        for (const dx of [-15, 0, 15]) box(dx - 4, -24, 8, 13, 2, C.rose);
        break;
    }
    ctx.restore();
  }

  function scTitle(t) {
    stage();
    box(504, 46, 410, 388, 21, C.green);
    oval(709, 238, 145, 145, '#406A54');
    plate(709, 360, 300, C.mint);
    const drop = easeO(seg(t, .03, .57));
    burger(709, 341 - (1 - drop) * 39, 1.35);
    accent(568, 152, C.butter);
    accent(842, 294, C.mint);
    tag('재료부터 차근차근', 56, 89, 154);
    text('수제버거가', 56, 191, 55);
    text('만들어지는 과정', 56, 257, 49);
    line([[56, 314], [440, 314]]);
    text('57초', 56, 354, 28, C.green);
    text('농장에서 식탁까지', 142, 354, 20, C.muted, 500);
  }

  function cow(x, y, size, graze = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size, size);
    line([[-42, -41], [-53, -29], [-52, -20]], C.meat, 3);
    box(-42, -52, 73, 34, 13, C.toast);
    for (const dx of [-32, -17, 12, 25]) box(dx, -24, 7, 22, 3, C.meat);
    ctx.save();
    ctx.translate(29, -40 + graze * 20);
    ctx.rotate(graze * .34);
    if (size > .62) {
      polygon([[2, -12], [-3, -24], [9, -15]], C.wheat);
      polygon([[16, -12], [24, -23], [22, -10]], C.wheat);
    }
    oval(-4, -10, 9, 5, C.toast, .5);
    oval(23, -9, 10, 5, C.toast, -.55);
    oval(9, 0, 18, 16, C.toast);
    oval(17, 7, 15, 8, C.wheat);
    oval(13, 5, 2, 2, C.meat);
    oval(24, 6, 2, 2, C.meat);
    oval(14, -3, 2.3, 2.3, C.ink);
    ctx.restore();
    ctx.restore();
  }

  function fence(x, y, width) {
    for (const dy of [0, 12]) line([[x, y + dy], [x + width, y + dy]], C.panel, 5);
    for (let dx = 0; dx <= width; dx += width / 6) box(x + dx - 3, y - 8, 6, 28, 2, C.panel);
  }

  function stalk(x, y, height, ripe, sway) {
    const color = ripe ? C.toast : C.green, tip = x + sway;
    line([[x, y], [tip, y - height]], color, 2.5);
    for (let i = 0; i < 3; i++) {
      const k = i % 2 ? -1 : 1;
      oval(tip + k * 4, y - height + 4 + i * 5, height * .15, 2.8, ripe ? C.butter : C.leaf, k * -.68);
    }
  }

  function vine(x, y, height, ripe, fruit = 1) {
    line([[x, y], [x, y - height - 4]], C.toast, 3);
    line([[x - 6, y], [x - 8, y - height * .70], [x + 4, y - height]], C.green, 3);
    for (const [i, dx] of [-14, 13, -11].entries()) {
      const dy = y - height * (.46 + i * .16);
      oval(x + dx / 2, dy - 5, 9, 3.8, C.leaf, dx / 22);
      if (fruit > i / 3) oval(x + dx, dy + 6, 5 + height * .09, 5 + height * .08, ripe ? C.tomato : C.leaf);
    }
  }

  function lettuceHead(x, y, size) {
    for (const [dx, dy, r] of [[-.6, 0, -.6], [.6, 0, .6], [0, -.46, 0]]) {
      oval(x + dx * size, y + dy * size, size * .53, size * .63, dx === 0 ? C.leaf : C.green, r);
    }
    line([[x - size * .38, y + size * .15], [x, y + size * .4], [x + size * .1, y - size * .64]], C.mint);
  }

  function basket(x, y, contents) {
    box(x - 32, y - 5, 64, 24, 6, C.toast);
    box(x - 36, y - 9, 72, 7, 3, C.wheat);
    for (const dx of [-20, 0, 20]) line([[x + dx, y + 2], [x + dx, y + 13]], C.wheat);
    contents();
  }

  function landscape() {
    box(48, 104, 864, 293, 19, C.sky);
    oval(158, 215, 93, 42, '#C2DAD0');
    oval(345, 212, 111, 55, '#C2DAD0');
    oval(602, 217, 148, 64, '#C2DAD0');
    oval(812, 221, 91, 42, '#C2DAD0');
    box(48, 219, 864, 178, 18, C.mint);
  }

  function deliveryTruck(x, y) {
    box(x - 85, y - 39, 104, 31, 5, C.green);
    box(x + 20, y - 60, 50, 54, 8, C.leaf);
    box(x + 37, y - 52, 26, 18, 5, C.sky);
    for (const [i, glyph] of ['beef', 'flour', 'veg'].entries()) {
      const left = x - 81 + i * 33;
      box(left, y - 64, 31, 25, 4, C.wheat);

  const SCENES = [

/* END GENERATED PILOT SOURCES */
const kit=createCanvasKit(ctx),{bg,clamp01}=kit;
const SCENES=createBurgerScenes(ctx,kit);
const TOTAL=SCENES.reduce((a,s)=>a+s.dur,0);
const starts=[];{let a=0;for(const s of SCENES){starts.push(a);a+=s.dur;}}

const capEl=document.getElementById('cap'),fillEl=document.getElementById('fill');
let tG=0,playing=true,lastTs=null,curIdx=-1;

function render(){
  bg();
  let idx=SCENES.length-1;
  for(let i=0;i<SCENES.length;i++){if(tG<starts[i]+SCENES[i].dur){idx=i;break;}}
  const sc=SCENES[idx],lt=clamp01((tG-starts[idx])/sc.dur);
  sc.draw(lt,tG);
  if(idx!==curIdx){curIdx=idx;capEl.textContent=sc.cap;}
  fillEl.style.width=(tG/TOTAL*100)+'%';
}
function frame(ts){
  if(lastTs===null)lastTs=ts;
  const dt=(ts-lastTs)/1000;lastTs=ts;
  if(playing){tG+=dt;if(tG>=TOTAL){tG=TOTAL;playing=false;}}
  render();
  if(tG===TOTAL&&rec?.state==='recording')rec.stop();
  requestAnimationFrame(frame);
}
function nextScene(){
  let idx=0;
  for(let i=0;i<SCENES.length;i++){if(tG<starts[i]+SCENES[i].dur-0.01){idx=i;break;}idx=i;}
  const n=(idx+1)%SCENES.length;
  tG=starts[n]+0.001;playing=true;curIdx=-1;
}
cv.addEventListener('click',nextScene);
document.getElementById('bNext').addEventListener('click',nextScene);
document.getElementById('bReplay').addEventListener('click',()=>{tG=0;playing=true;curIdx=-1;});

/* ================= 녹화 (webm 내보내기) ================= */
let rec=null,chunks=[];
const bRec=document.getElementById('bRec');
bRec.addEventListener('click',()=>{
  if(rec){if(rec.state==='recording')rec.stop();return;}
  chunks=[];
  try{
    const stream=cv.captureStream(30);
    rec=new MediaRecorder(stream,{mimeType:'video/webm'});
  }catch(e){alert('이 브라우저에서는 녹화가 지원되지 않습니다.');return;}
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='suje-burger-pilot-v3.webm';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    rec=null;bRec.textContent='● 녹화';
  };
  rec.start();
  bRec.textContent='■ 중지';
  tG=0;playing=true;lastTs=null;curIdx=-1;
});

requestAnimationFrame(frame);
</script>
