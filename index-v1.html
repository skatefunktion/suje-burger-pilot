<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국 수제버거가 만들어지는 과정 — 파일럿</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#26221c;color:#f5efe2;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
  h1{font-size:18px;margin:8px 0 12px;font-weight:700}
  h1 span{font-weight:400;font-size:13px;color:#b9ac93}
  #wrap{width:100%;max-width:960px}
  canvas{width:100%;display:block;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.45);cursor:pointer;background:#FAF5EA}
  #bar{height:6px;background:#4a4238;border-radius:3px;margin-top:10px;overflow:hidden}
  #fill{height:100%;width:0%;background:#E8A94F}
  #cap{min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;line-height:1.5;padding:10px 12px}
  #btns{display:flex;gap:10px;margin:6px 0 18px;flex-wrap:wrap;justify-content:center}
  button{background:#E8A94F;border:none;color:#26221c;font-weight:700;font-size:15px;padding:10px 18px;border-radius:999px;cursor:pointer}
  button:active{transform:scale(.96)}
  #hint{font-size:13px;color:#b9ac93;text-align:center;max-width:660px;line-height:1.7}
</style>
</head>
<body>
<h1>🍔 한국 수제버거가 만들어지는 과정 <span>— 파일럿 스캐폴드 (탭하면 다음 장면)</span></h1>
<div id="wrap">
  <canvas id="stage" width="960" height="540"></canvas>
  <div id="bar"><div id="fill"></div></div>
  <div id="cap"></div>
  <div id="btns">
    <button id="bReplay">⏯ 다시 보기</button>
    <button id="bNext">⏭ 다음 장면</button>
    <button id="bRec">● 녹화</button>
  </div>
  <p id="hint">화면을 탭하면 다음 장면으로 넘어갑니다. '녹화'를 누르면 처음부터 재생되며 webm 영상으로 저장됩니다.<br>내레이션 음성은 Fish Audio TTS 등으로 장면별 제작해 합치는 구조입니다. (스토리보드는 storyboard.md)</p>
</div>
<script>
"use strict";
/* ================= 기본 설정 ================= */
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
const W=960,H=540;
const INK='#4a3728',PAPER='#FAF5EA',BUN='#E8A94F',PATTY='#7a4e2d',
      CHEESE='#f5b942',LETTUCE='#7cb26b',TOMATO='#e2574c';
ctx.lineJoin='round';ctx.lineCap='round';

/* ================= 유틸 ================= */
const clamp01=v=>Math.max(0,Math.min(1,v));
const seg=(t,a,b)=>clamp01((t-a)/(b-a));          // t를 [a,b] 구간의 0~1로
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}; // 결정적 난수
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeO=t=>1-Math.pow(1-t,3);
const easeOB=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}; // 통통 튀는 착지

/* 손그림 선: 직선을 살짝 흔들리게 */
function jline(x1,y1,x2,y2,seed=1,amp=2.2){
  const n=9;ctx.beginPath();
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,px=-dy/len,py=dx/len;
  for(let i=0;i<=n;i++){const t=i/n;
    const off=(rnd(seed*13+i*7)-.5)*2*amp*Math.sin(t*Math.PI);
    const X=x1+dx*t+px*off,Y=y1+dy*t+py*off;
    i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
  ctx.stroke();
}
/* 손그림 타원 */
function jellipse(x,y,rx,ry,seed=5,a0=0,a1=Math.PI*2){
  const n=28;ctx.beginPath();
  for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;
    const rj=1+(rnd(seed*17+i*3)-.5)*0.06;
    const X=x+Math.cos(a)*rx*rj,Y=y+Math.sin(a)*ry*rj;
    i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
  ctx.closePath();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

/* 종이 배경 + 잉크 텍스트 */
const paperDots=[];for(let i=0;i<70;i++)paperDots.push([rnd(i)*W,rnd(i+999)*H,rnd(i+50)*2+0.5]);
function bg(){
  ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(74,55,40,0.05)';
  for(const d of paperDots){ctx.beginPath();ctx.arc(d[0],d[1],d[2],0,7);ctx.fill();}
}
function label(txt,x,y,size=34,color=INK,weight=800){
  ctx.fillStyle=color;
  ctx.font=weight+' '+size+'px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y);
}

/* ================= 버거 부품 ================= */
function sesame(cx,ty,w,n,seed){
  ctx.fillStyle='#fff8e7';
  for(let i=0;i<n;i++){
    const x=cx-w/2+(i+0.5)*(w/n)+(rnd(seed+i)-.5)*14;
    const y=ty-20-rnd(seed+50+i)*22;
    ctx.save();ctx.translate(x,y);ctx.rotate((rnd(seed+i+9)-.5)*1.2);
    ctx.beginPath();ctx.ellipse(0,0,7,4.5,0,0,7);ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();
  }
}
/* 레이어: 0 아래번 1 양상추 2 토마토 3 치즈 4 패티 5 위번(+깨) */
function drawLayer(i,cx,y,w){
  ctx.lineWidth=4;ctx.strokeStyle=INK;
  switch(i){
    case 0:
      ctx.fillStyle=BUN;
      ctx.beginPath();ctx.ellipse(cx,y-16,w/2,16,0,0,Math.PI);ctx.fill();ctx.stroke();
      break;
    case 1:
      ctx.lineWidth=11;ctx.strokeStyle=LETTUCE;ctx.beginPath();
      {const n=14;for(let k=0;k<=n;k++){const x=cx-w/2+k*(w/n),yy=y+Math.sin(k*1.7)*7;k?ctx.lineTo(x,yy):ctx.moveTo(x,yy);}}
      ctx.stroke();
      ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.beginPath();
      {const n=14;for(let k=0;k<=n;k++){const x=cx-w/2+k*(w/n),yy=y+Math.sin(k*1.7)*7;k?ctx.lineTo(x,yy):ctx.moveTo(x,yy);}}
      ctx.stroke();
      break;
    case 2:
      ctx.fillStyle=TOMATO;
      for(const dx of [-w*0.2,w*0.2]){jellipse(cx+dx,y-9,32,9,200+dx);ctx.fill();ctx.stroke();}
      break;
    case 3:
      ctx.save();ctx.translate(cx,y-12);ctx.rotate(-0.07);
      ctx.fillStyle=CHEESE;
      {const cw=w*0.98;rr(-cw/2,-11,cw,22,6);ctx.fill();ctx.stroke();}
      ctx.restore();
      break;
    case 4:
      ctx.fillStyle=PATTY;
      rr(cx-w/2,y-24,w,24,12);ctx.fill();ctx.stroke();
      ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=2;
      for(let k=0;k<3;k++)jline(cx-w/2+16,y-17+k*6,cx+w/2-16,y-17+k*6,400+k,1.2);
      break;
    case 5:
      ctx.fillStyle=BUN;
      ctx.beginPath();ctx.ellipse(cx,y,w/2,44,0,Math.PI,Math.PI*2);ctx.fill();ctx.stroke();
      sesame(cx,y,w,7,300);
      break;
  }
}
const LAY=[0,-34,-42,-56,-80,-102]; // baseY 기준 레이어 y 오프셋 (아래→위)

/* ================= 장면 0: 타이틀 (5초) ================= */
function scTitle(t){
  const cx=W/2,baseY=400,w=380;
  for(let i=0;i<6;i++){
    const p=easeOB(seg(t,i*0.12,i*0.12+0.25));
    if(p<=0)continue;
    ctx.save();
    ctx.globalAlpha=clamp01(p*1.6);
    ctx.translate(0,(1-clamp01(p))*-40);
    drawLayer(i,cx,baseY+LAY[i]*(w/420),w);
    ctx.restore();
  }
  ctx.save();
  ctx.globalAlpha=seg(t,0.4,0.7);
  label('수제버거가 만들어지는 과정',cx,110,52);
  ctx.globalAlpha=seg(t,0.65,0.9);
  label('코드 한 줄 한 줄이 그린 45초 애니메이션',cx,165,26,'#8a7a63',400);
  ctx.restore();
}

/* ================= 장면 1: 번 — 반죽→발효→굽기 (8초) ================= */
function scBun(t){
  const cx=W/2;
  // --- 반죽 (0~0.36)
  const flourA=1-seg(t,0.25,0.36), doughA=seg(t,0.22,0.36);
  ctx.save();ctx.globalAlpha=flourA;
  ctx.fillStyle='#fffdf5';ctx.lineWidth=4;ctx.strokeStyle=INK;
  jellipse(cx,400,120,52,11);ctx.fill();ctx.stroke();
  jline(cx-70,372,cx+70,372,12,3); // 밀가루 언덕 선
  label('밀가루',cx,470,28,'#8a7a63',400);
  ctx.restore();
  // 물 붓기
  const wp=seg(t,0.1,0.28);
  if(wp>0&&wp<1){
    ctx.strokeStyle='#7fb3d5';ctx.lineWidth=7;
    for(const dx of [-30,0,30])jline(cx+dx,180,cx+dx,180+150*wp,50+dx,2);
  }
  // 반죽 (찌그러지며 치대는 느낌)
  if(doughA>0){
    ctx.save();ctx.globalAlpha=doughA;
    const sq=Math.sin(t*40)*0.12*seg(t,0.24,0.36);
    ctx.fillStyle='#f0dcae';ctx.lineWidth=4;ctx.strokeStyle=INK;
    ctx.beginPath();ctx.ellipse(cx,400,120*(1+sq),52*(1-sq),0,0,7);ctx.fill();ctx.stroke();
    label('반죽',cx,470,28,'#8a7a63',400);
    ctx.restore();
  }
  // --- 발효 (0.38~0.66)
  const fp=seg(t,0.38,0.66);
  if(fp>0){
    label('발효 중…',150,80,30);
    for(let k=0;k<3;k++){
      const x=cx-150+k*150,r=lerp(8,52,easeO(fp));
      ctx.fillStyle='#f0dcae';ctx.lineWidth=4;ctx.strokeStyle=INK;
      ctx.beginPath();ctx.arc(x,400,r,0,7);ctx.fill();ctx.stroke();
    }
    // 올라가는 김(발효 부풀음)
    ctx.strokeStyle='rgba(74,55,40,0.35)';ctx.lineWidth=3;
    for(let k=0;k<6;k++){
      const x=cx-180+rnd(k)*360,y=340-((t*300+k*53)%120);
      ctx.globalAlpha=0.5*(1-((t*300+k*53)%120)/120);
      jline(x,y,x+8*Math.sin(t*20+k),y-24,600+k,2);
    }
    ctx.globalAlpha=1;
  }
  // --- 굽기 (0.68~1)
  const bp=seg(t,0.68,1);
  if(bp>0){
    ctx.save();ctx.globalAlpha=bp;
    label('굽기',150,80,30);
    ctx.fillStyle='#6b5a48';ctx.lineWidth=5;ctx.strokeStyle=INK;
    rr(cx-180,140,360,260,24);ctx.fill();ctx.stroke();
    ctx.fillStyle='#2e2620';rr(cx-140,190,280,150,12);ctx.fill();
    const gold=seg(t,0.78,0.98);
    const col='rgb('+Math.round(lerp(243,232,gold))+','+Math.round(lerp(227,169,gold))+','+Math.round(lerp(194,79,gold))+')';
    ctx.fillStyle=col;ctx.lineWidth=4;ctx.strokeStyle=INK;
    for(const dx of [-70,70]){
      ctx.beginPath();ctx.ellipse(cx+dx,300,52,34,0,Math.PI,Math.PI*2);ctx.fill();ctx.stroke();
    }
    // 열기
    ctx.strokeStyle='rgba(232,169,79,0.8)';ctx.lineWidth=4;
    for(let k=0;k<3;k++){
      const x=cx-60+k*60;
      jline(x,250+Math.sin(t*30+k)*6,x+10*Math.sin(t*24+k*2),190,700+k,3);
    }
    ctx.restore();
  }
}

/* ================= 장면 2: 패티 — 다지기→빚기→굽기 (8초) ================= */
function scPatty(t){
  const cx=W/2;
  // --- 다지기 (0~0.3)
  const cp=seg(t,0,0.3);
  if(cp<1||t<0.32){
    ctx.save();ctx.globalAlpha=1-seg(t,0.28,0.34);
    // 도마 위 고기 조각
    ctx.fillStyle='#c65a4a';ctx.lineWidth=3;ctx.strokeStyle=INK;
    for(let k=0;k<5;k++){
      const p=easeO(seg(t,k*0.04,k*0.04+0.12));
      const x=cx-120+k*60,y=380-(1-p)*200;
      ctx.save();ctx.translate(x,y);ctx.rotate((rnd(k)-.5)*0.6);
      rr(-22,-16,44,32,8);ctx.fill();ctx.stroke();ctx.restore();
    }
    // 식칼 (위아래로 톡톡)
    const bob=Math.abs(Math.sin(t*28))*36*seg(t,0.05,0.3);
    ctx.fillStyle='#cfd6dd';ctx.lineWidth=4;ctx.strokeStyle=INK;
    ctx.save();ctx.translate(cx,150+bob);ctx.rotate(0.25);
    rr(-90,-26,150,52,10);ctx.fill();ctx.stroke();
    ctx.strokeStyle=INK;jline(60,0,110,0,900,2); // 손잡이
    ctx.restore();
    label('다지기',150,80,30);
    ctx.restore();
  }
  // --- 빚기 (0.32~0.58)
  const mp=seg(t,0.32,0.58);
  if(mp>0&&mp<1||(t>=0.32&&t<0.6)){
    ctx.save();ctx.globalAlpha=seg(t,0.32,0.4)*(1-seg(t,0.56,0.62));
    label('빚기',150,80,30);
    const p=easeIO(mp),rx=lerp(50,110,p),ry=lerp(50,26,p);
    ctx.fillStyle=PATTY;ctx.lineWidth=4;ctx.strokeStyle=INK;
    ctx.beginPath();ctx.ellipse(cx,380,rx,ry,0,0,7);ctx.fill();ctx.stroke();
    // 누르는 선
    ctx.strokeStyle='rgba(74,55,40,0.5)';ctx.lineWidth=3;
    for(const dx of [-60,0,60])jline(cx+dx,270,cx+dx,300,950+dx,2);
    ctx.restore();
  }
  // --- 굽기 (0.6~1)
  const gp=seg(t,0.6,1);
  if(gp>0){
    ctx.save();ctx.globalAlpha=gp;
    label('굽기',150,80,30);
    // 철판
    ctx.fillStyle='#3a332c';ctx.lineWidth=5;ctx.strokeStyle=INK;
    rr(cx-200,340,400,90,16);ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=3;
    for(let k=0;k<4;k++)jline(cx-170+k*90,355,cx-170+k*90,415,960+k,1.5);
    // 패티 (뒤집기: 0.82~0.92에 납작해졌다 펴짐)
    const fp=seg(t,0.82,0.92),sy=Math.abs(Math.cos(fp*Math.PI));
    ctx.save();ctx.translate(cx,330);ctx.scale(1,Math.max(0.15,sy));
    ctx.fillStyle=PATTY;ctx.lineWidth=4;ctx.strokeStyle=INK;
    rr(-95,-22,190,44,20);ctx.fill();ctx.stroke();
    ctx.restore();
    // 지글지글
    for(let k=0;k<8;k++){
      const a=rnd(k*3)*Math.PI*2,rr2=110+rnd(k*7)*30;
      const x=cx+Math.cos(a)*rr2,y=330+Math.sin(a)*rr2*0.5;
      ctx.globalAlpha=gp*(0.4+0.6*Math.abs(Math.sin(t*40+k*2)));
      ctx.strokeStyle='#E8A94F';ctx.lineWidth=4;
      jline(x-8,y,x+8,y,970+k,1.5);
    }
    ctx.globalAlpha=gp;
    // 김
    ctx.strokeStyle='rgba(74,55,40,0.4)';ctx.lineWidth=3;
    for(let k=0;k<3;k++){
      const x=cx-70+k*70,y=290-((t*200+k*67)%90);
      jline(x,y,x+10*Math.sin(t*18+k*2),y-30,980+k,2.5);
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

/* ================= 장면 3: 쌓기 (11초) — 하이라이트 ================= */
function scStack(t){
  const cx=W/2,baseY=452,w=420;
  // 그림자
  const landed=easeO(seg(t,0,0.75));
  ctx.fillStyle='rgba(74,55,40,'+(0.12*landed)+')';
  ctx.beginPath();ctx.ellipse(cx,baseY+14,lerp(60,190,landed),16,0,0,7);ctx.fill();
  for(let i=0;i<6;i++){
    const p=easeOB(seg(t,i*0.11,i*0.11+0.3));
    if(p<=0)continue;
    const yOff=-(1-p)*460;
    ctx.save();
    ctx.globalAlpha=clamp01(p*1.6);
    drawLayer(i,cx,baseY+LAY[i]*(w/420)+yOff,w);
    ctx.restore();
  }
  const done=seg(t,0.86,1);
  if(done>0){ctx.save();ctx.globalAlpha=done;label('착착…',cx,120,40,'#8a7a63',400);ctx.restore();}
}

/* ================= 장면 4: 한국 트위스트 — 불고기 소스 + 깨 (8초) ================= */
function scSauce(t){
  const cx=W/2,baseY=452,w=380;
  // 버거 팡 터지듯 등장
  const pop=easeOB(seg(t,0,0.18));
  ctx.save();
  ctx.globalAlpha=clamp01(pop*1.6);
  ctx.translate(cx,0);ctx.scale(Math.max(0.01,pop),Math.max(0.01,pop));ctx.translate(-cx,0);
  for(let i=0;i<6;i++)drawLayer(i,cx,baseY+LAY[i]*(w/420),w);
  ctx.restore();
  if(pop<1)return;
  const topY=baseY+LAY[5]*(w/420); // 위번 바닥
  // 소스 줄기 (위에서 떨어짐)
  const sp=seg(t,0.18,0.42);
  if(sp>0){
    ctx.strokeStyle='#a8542f';ctx.lineWidth=9;
    const yEnd=lerp(40,topY-30,sp);
    jline(cx+20*Math.sin(t*30),30,cx+14*Math.sin(t*26+1),yEnd,1100,3);
    // 소스 방울
    ctx.fillStyle='#a8542f';
    ctx.beginPath();ctx.arc(cx+14*Math.sin(t*26+1),yEnd+8,9,0,7);ctx.fill();
  }
  // 지그재그 소스 (번 위에)
  const zp=seg(t,0.4,0.62);
  if(zp>0){
    ctx.strokeStyle='#a8542f';ctx.lineWidth=8;ctx.beginPath();
    const n=26,x0=cx-w/2+20,x1=cx+w/2-20;
    for(let k=0;k<=n;k++){
      const x=x0+(x1-x0)*k/n,y=topY-34+((k%2)?-10:10);
      if(k/n>zp)break;
      k?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
  // 깨 솔솔
  const kp=seg(t,0.6,0.88);
  if(kp>0){
    for(let k=0;k<14;k++){
      const x0=cx+(rnd(k*3)-0.5)*300;
      const fall=easeO(seg(t,0.6+rnd(k*7)*0.12,0.88));
      const y=lerp(60,topY-24-rnd(k*11)*26,fall);
      ctx.save();ctx.translate(x0,y);ctx.rotate(rnd(k)*3);
      ctx.fillStyle='#fff8e7';ctx.beginPath();ctx.ellipse(0,0,7,4.5,0,0,7);ctx.fill();
      ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();
    }
  }
  const lp=seg(t,0.86,1);
  if(lp>0){ctx.save();ctx.globalAlpha=lp;label('특제 불고기 소스',cx,120,40,'#a8542f');ctx.restore();}
}

/* ================= 장면 5: 완성 + 크레딧 (5초) ================= */
function scDone(t){
  const cx=W/2,baseY=440,w=400;
  const pop=easeOB(seg(t,0,0.3));
  ctx.save();
  ctx.translate(cx,baseY);ctx.scale(Math.max(0.01,pop),Math.max(0.01,pop));ctx.translate(-cx,-baseY);
  for(let i=0;i<6;i++)drawLayer(i,cx,baseY+LAY[i]*(w/420),w);
  ctx.restore();
  // 반짝이
  const sh=seg(t,0.3,0.55);
  if(sh>0&&sh<1){
    ctx.save();ctx.globalAlpha=0.5*(1-sh);ctx.fillStyle='#fff';
    ctx.translate(cx+120,baseY-160);ctx.rotate(0.5);
    ctx.fillRect(-14,-120,28,200);ctx.restore();
  }
  ctx.save();ctx.globalAlpha=seg(t,0.35,0.6);
  label('완성! 맛있게 드세요 🍔',cx,105,46);
  ctx.restore();
  // 크레딧 (꿀벌 이름표 오마주: 깨소금에게도 이름표를)
  const cp=seg(t,0.6,0.9);
  if(cp>0){
    ctx.save();ctx.globalAlpha=cp;
    label('번 — 밀가루 · 패티 — 소고기 · 소스 — 불고기',cx,492,24,'#8a7a63',400);
    const sx=cx+300,sy=470;
    ctx.fillStyle='#fff8e7';ctx.beginPath();ctx.ellipse(sx,sy,10,6.5,0.4,0,7);ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();
    ctx.fillStyle='#fff';ctx.lineWidth=2;ctx.strokeStyle=INK;
    rr(sx+14,sy-32,64,26,6);ctx.fill();ctx.stroke();
    jline(sx+8,sy-8,sx+16,sy-20,1200,1.5);
    label('깨소금',sx+46,sy-18,17);
    ctx.restore();
  }
}

/* ================= 타임라인 엔진 ================= */
const SCENES=[
  {dur:5, cap:'수제버거가 만들어지는 과정', draw:scTitle},
  {dur:8, cap:'하나, 번. 밀가루를 반죽해 발효시키고 노릇하게 굽습니다', draw:scBun},
  {dur:8, cap:'둘, 패티. 소고기를 다져 빚고 뜨거운 철판에 굽습니다', draw:scPatty},
  {dur:11,cap:'셋, 쌓기. 양상추, 토마토, 치즈, 패티를 순서대로 올립니다', draw:scStack},
  {dur:8, cap:'넷, 한국 트위스트. 특제 불고기 소스를 뿌리고 깨를 솔솔', draw:scSauce},
  {dur:5, cap:'완성! 맛있게 드세요 🍔', draw:scDone},
];
const TOTAL=SCENES.reduce((a,s)=>a+s.dur,0);
const starts=[];{let a=0;for(const s of SCENES){starts.push(a);a+=s.dur;}}

const capEl=document.getElementById('cap'),fillEl=document.getElementById('fill');
let tG=0,playing=true,lastTs=null,curIdx=-1;

function render(){
  bg();
  let idx=SCENES.length-1;
  for(let i=0;i<SCENES.length;i++){if(tG<starts[i]+SCENES[i].dur){idx=i;break;}}
  const sc=SCENES[idx],lt=clamp01((tG-starts[idx])/sc.dur);
  sc.draw(lt,tG);
  if(idx!==curIdx){curIdx=idx;capEl.textContent=sc.cap;}
  fillEl.style.width=(tG/TOTAL*100)+'%';
}
function frame(ts){
  if(lastTs===null)lastTs=ts;
  const dt=(ts-lastTs)/1000;lastTs=ts;
  if(playing){tG+=dt;if(tG>=TOTAL){tG=TOTAL;playing=false;}}
  render();
  requestAnimationFrame(frame);
}
function nextScene(){
  let idx=0;
  for(let i=0;i<SCENES.length;i++){if(tG<starts[i]+SCENES[i].dur-0.01){idx=i;break;}idx=i;}
  const n=(idx+1)%SCENES.length;
  tG=starts[n]+0.001;playing=true;curIdx=-1;
}
cv.addEventListener('click',nextScene);
document.getElementById('bNext').addEventListener('click',nextScene);
document.getElementById('bReplay').addEventListener('click',()=>{tG=0;playing=true;curIdx=-1;});

/* ================= 녹화 (webm 내보내기) ================= */
let rec=null,chunks=[];
const bRec=document.getElementById('bRec');
bRec.addEventListener('click',()=>{
  if(rec){rec.stop();return;}
  chunks=[];
  try{
    const stream=cv.captureStream(30);
    rec=new MediaRecorder(stream,{mimeType:'video/webm'});
  }catch(e){alert('이 브라우저에서는 녹화가 지원되지 않습니다.');return;}
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:'video/webm'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='suje-burger-pilot.webm';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    rec=null;bRec.textContent='● 녹화';
  };
  rec.start();
  bRec.textContent='■ 중지';
  tG=0;playing=true;curIdx=-1; // 처음부터 재생하며 녹화
});

requestAnimationFrame(frame);
</script>
